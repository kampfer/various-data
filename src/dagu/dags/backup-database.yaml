# 数据库备份：每月 1 日 00:00 执行一次
# 依赖宿主环境变量：PYTHON_BIN、DAGU_DIR、mode、ALERT_EMAIL（见 README）
schedule: "0 0 1 * *"
queue: db_backup

error_mail:
  from: "${ALERT_EMAIL}"
  to: "${ALERT_EMAIL}"
  prefix: "[various-data]"

steps:
  - name: backup
    action: exec
    with:
      command: ${PYTHON_BIN}
      args:
        - ${DAGU_DIR}/tasks/db_backup.py
    retry_policy:
      limit: 2
      interval_sec: 300
    mail_on_error: true
