# 央行公开市场操作：每天 12:00 抓取一次
# 依赖宿主环境变量：PYTHON_BIN、DAGU_DIR、mode、ALERT_EMAIL（见 README）
schedule: "0 12 * * *"
queue: omo

error_mail:
  from: "${ALERT_EMAIL}"
  to: "${ALERT_EMAIL}"
  prefix: "[various-data]"

steps:
  - name: crawl
    action: exec
    with:
      command: ${PYTHON_BIN}
      args:
        - ${DAGU_DIR}/tasks/omo.py
    retry_policy:
      limit: 2
      interval_sec: 300
    mail_on_error: true
