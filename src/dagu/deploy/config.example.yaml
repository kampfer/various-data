# Dagu 全局配置：复制到 ~/.config/dagu/config.yaml，按机器修改
# 文件名必须是 config.yaml，Dagu 只从这个位置读取

dags_dir: /opt/various-data/src/dagu/dags

# 触发时间按东八区解释，不依赖 systemd 的 TZ 是否传递成功
tz: Asia/Shanghai

# v2 的并发控制手段：max_active_runs 已废弃，靠队列实现"同一任务同时只跑一个"
queues:
  enabled: true
  config:
    - name: sina_news
      max_concurrency: 1
    - name: omo
      max_concurrency: 1
    - name: db_backup
      max_concurrency: 1

# 只监听回环地址，通过 SSH 端口转发访问控制台
host: 127.0.0.1
port: 8080
